services:
  ispeakllm.middleware:
    class: Drupal\ispeakllm\StackMiddleware\IspeakLLMMiddleware
    tags:
      # Above page_cache (200), so agent variants are answered and HTML pages decorated
      # whether or not the page came from the cache.
      - { name: http_middleware, priority: 210, responder: true }
